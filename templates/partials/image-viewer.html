<dialog class="modal image-viewer-modal" id="imageViewerDialog" aria-labelledby="imageViewerTitle">
  <div class="image-viewer-layout">
    <header class="image-viewer-toolbar">
      <div class="image-viewer-title">
        <span class="eyebrow">Image Preview</span>
        <strong id="imageViewerTitle">图片预览</strong>
      </div>
      <div class="image-viewer-controls" role="group" aria-label="图片缩放控制">
        <button class="icon-button" type="button" id="imageViewerZoomOut" title="缩小" aria-label="缩小"><i data-lucide="zoom-out"></i></button>
        <input id="imageViewerZoomSlider" type="range" min="0.25" max="8" step="0.05" value="1" aria-label="缩放比例">
        <span class="image-viewer-zoom-label" id="imageViewerZoomLabel">100%</span>
        <button class="icon-button" type="button" id="imageViewerZoomIn" title="放大" aria-label="放大"><i data-lucide="zoom-in"></i></button>
        <button class="icon-button" type="button" id="imageViewerFit" title="适应窗口" aria-label="适应窗口"><i data-lucide="scan"></i></button>
        <button class="button ghost small image-viewer-mask-toggle" type="button" id="imageViewerMaskToggle" hidden aria-pressed="false"><i data-lucide="scan-line"></i><span>查看重绘区域</span></button>
      </div>
      <div class="image-viewer-actions" role="group" aria-label="图片操作">
        <button class="button secondary small" type="button" id="imageViewerCopy" title="将完整尺寸的图片复制到剪贴板。" disabled><i data-lucide="copy"></i>复制图片</button>
        <button class="button secondary small" type="button" id="imageViewerDownload" title="下载当前预览图片的原始文件。" disabled><i data-lucide="download"></i>下载原图</button>
        <button class="icon-button" type="button" data-close-dialog="imageViewerDialog" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
    </header>
    <div class="image-viewer-stage" id="imageViewerStage" tabindex="0" aria-label="图片预览区域">
      <img id="imageViewerImage" alt="" decoding="async">
      <canvas id="imageViewerMaskOverlay" aria-hidden="true"></canvas>
    </div>
  </div>
</dialog>
